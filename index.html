<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔧 Тест Автомеханика</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
  
  body {
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    color: #fff;
  }
  
  .container {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 40px;
    max-width: 750px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  }
  
  h1 { text-align: center; font-size: 2em; margin-bottom: 10px; 
       background: linear-gradient(90deg, #f39c12, #e74c3c);
       -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  
  .subtitle { text-align: center; color: #aaa; margin-bottom: 30px; }
  
  .level-badge {
    display: inline-block;
    padding: 6px 18px;
    border-radius: 20px;
    font-weight: bold;
    font-size: 0.9em;
    margin-bottom: 20px;
  }
  
  .level-1 { background: #27ae60; }
  .level-2 { background: #f39c12; }
  .level-3 { background: #e74c3c; }
  .level-4 { background: #8e44ad; }
  
  .question {
    font-size: 1.3em;
    margin-bottom: 25px;
    line-height: 1.5;
    min-height: 60px;
  }
  
  .options { display: flex; flex-direction: column; gap: 12px; }
  
  .option {
    background: rgba(255,255,255,0.08);
    border: 2px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    padding: 16px 20px;
    cursor: pointer;
    transition: all 0.25s;
    font-size: 1.05em;
    text-align: left;
    color: #fff;
  }
  
  .option:hover:not(.disabled) {
    background: rgba(243,156,18,0.2);
    border-color: #f39c12;
    transform: translateX(5px);
  }
  
  .option.correct { background: rgba(39,174,96,0.4); border-color: #27ae60; }
  .option.wrong { background: rgba(231,76,60,0.4); border-color: #e74c3c; }
  .option.disabled { cursor: default; }
  
  .progress-bar {
    height: 8px;
    background: rgba(255,255,255,0.1);
    border-radius: 4px;
    margin-bottom: 25px;
    overflow: hidden;
  }
  
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #f39c12, #e74c3c);
    border-radius: 4px;
    transition: width 0.4s;
  }
  
  .stats {
    display: flex;
    justify-content: space-between;
    margin-bottom: 15px;
    font-size: 0.95em;
    color: #ccc;
  }
  
  .btn {
    display: block;
    width: 100%;
    padding: 16px;
    margin-top: 25px;
    border: none;
    border-radius: 12px;
    font-size: 1.1em;
    font-weight: bold;
    cursor: pointer;
    background: linear-gradient(90deg, #f39c12, #e74c3c);
    color: #fff;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  
  .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(243,156,18,0.4); }
  
  .center { text-align: center; }
  
  .result-emoji { font-size: 5em; margin: 20px 0; }
  .result-title { font-size: 1.8em; margin-bottom: 10px; }
  .result-score { font-size: 2.5em; font-weight: bold; color: #f39c12; margin: 15px 0; }
  .result-text { color: #bbb; margin-bottom: 10px; }
  
  .level-select {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 15px;
    margin-top: 20px;
  }
  
  .level-card {
    padding: 25px 15px;
    border-radius: 15px;
    text-align: center;
    cursor: pointer;
    border: 2px solid rgba(255,255,255,0.15);
    transition: all 0.25s;
    background: rgba(255,255,255,0.05);
  }
  
  .level-card:hover { transform: translateY(-5px); border-color: #f39c12; }
  .level-card .icon { font-size: 2.5em; margin-bottom: 10px; }
  .level-card .name { font-weight: bold; margin-bottom: 5px; }
  .level-card .desc { font-size: 0.85em; color: #aaa; }
  
  .hidden { display: none; }
  
  .explanation {
    margin-top: 15px;
    padding: 12px;
    background: rgba(52,152,219,0.15);
    border-left: 4px solid #3498db;
    border-radius: 6px;
    font-size: 0.95em;
    color: #cde;
    display: none;
  }
</style>
</head>

  </div>

  <!-- РЕЗУЛЬТАТ -->
  <div id="result" class="hidden center">

let answered = false;
let levelQuestions = [];

const levelNames = {1: "Новичок 🟢", 2: "Любитель 🟡", 3: "Профи 🔴", 4: "Эксперт 🟣"};
const totalQuestions = 10;

function startLevel(level) {
  currentLevel = level;
  currentQuestionIndex = 0;
  score = 0;
  answered = false;
  
  // Перемешиваем вопросы
  levelQuestions = [...questionsDB[level]].sort(() => Math.random() - 0.5);
  
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('result').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  
  const badge = document.getElementById('levelBadge');
  badge.textContent = levelNames[level];
  badge.className = 'level-badge level-' + level;
  
  loadQuestion();
}

function loadQuestion() {
  answered = false;
  const q = levelQuestions[currentQuestionIndex];
  
  document.getElementById('questionText').textContent = q.q;
  document.getElementById('progressText').textContent = `Вопрос ${currentQuestionIndex + 1}/${totalQuestions}`;
  document.getElementById('scoreText').textContent = `Счёт: ${score}`;
  document.getElementById('progressFill').style.width = ((currentQuestionIndex) / totalQuestions * 100) + '%';
  
  const expBox = document.getElementById('explanation');
  expBox.style.display = 'none';
  expBox.textContent = '';
  
  const nextBtn = document.getElementById('nextBtn');
  nextBtn.classList.add('hidden');
  
  const optionsBox = document.getElementById('optionsBox');
  optionsBox.innerHTML = '';
  
  q.options.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = opt;
    btn.onclick = () => selectAnswer(idx, btn);
    optionsBox.appendChild(btn);
  });
}

function selectAnswer(idx, btn) {
  if (answered) return;
  answered = true;
  
  const q = levelQuestions[currentQuestionIndex];
  const allOptions = document.querySelectorAll('.option');
  allOptions.forEach(o => o.classList.add('disabled'));
  
  if (idx === q.correct) {
    btn.classList.add('correct');
    score++;
    document.getElementById('scoreText').textContent = `Счёт: ${score}`;
  } else {
    btn.classList.add('wrong');
    allOptions[q.correct].classList.add('correct');
  }
  
  const expBox = document.getElementById('explanation');
  expBox.textContent = '💡 ' + q.exp;
  expBox.style.display = 'block';
  
  document.getElementById('nextBtn').classList.remove('hidden');
}

function nextQuestion() {
  currentQuestionIndex++;
  if (currentQuestionIndex < totalQuestions) {
    loadQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById('game').classList.add('hidden');
  document.getElementById('result').classList.remove('hidden');
  
  const percent = Math.round(score / totalQuestions * 100);
  
  let emoji, title, text;
  if (percent === 100) {
    emoji = "🏆"; title = "Идеально!"; 
    text = "Ты настоящий мастер своего дела! 👨‍🔧";
  } else if (percent >= 80) {
    emoji = "🌟"; title = "Отличный результат!"; 
    text = "Высокий уровень знаний. Продолжай в том же духе!";
  } else if (percent >= 60) {
    emoji = "👍"; title = "Хороший результат!"; 
    text = "Есть небольшие пробелы, но база крепкая.";
  } else if (percent >= 40) {
    emoji = "🔧"; title = "Неплохо, но..."; 
    text = "Стоит повторить теорию и попробовать снова.";
  } else {
    emoji = "📚"; title = "Нужно учиться!"; 
    text = "Не расстраивайся — повтори материалы и возвращайся!";
  }
  
  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultScore').textContent = `${score} / ${totalQuestions} (${percent}%)`;
  document.getElementById('resultText').textContent = text;
}

function backToMenu() {
  document.getElementById('result').classList.add('hidden');
  document.getElementById('game').classList.add('hidden');
  document.getElementById('menu').classList.remove('hidden');
}
</script>
