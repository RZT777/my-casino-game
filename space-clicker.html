<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Космический Кликер</title>
<style>
  body { font-family: Arial, sans-serif; background: #090a0f; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }
  .game { display: flex; gap: 30px; }
  .planet { width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #ff6b6b, #862e2e); cursor: pointer; box-shadow: 0 0 50px rgba(255,107,107,0.5); transition: transform 0.1s; }
  .planet:active { transform: scale(0.9); }
  .panel { background: rgba(255,255,255,0.1); padding: 20px; border-radius: 15px; width: 300px; }
  .score { font-size: 40px; color: #00d2ff; font-weight: bold; text-align: center; }
  .item { background: rgba(0,0,0,0.5); padding: 10px; margin-bottom: 10px; border-radius: 8px; cursor: pointer; border: 1px solid #333; }
  .item:hover { border-color: #00d2ff; }
  #error { position: fixed; top: 10px; left: 10px; color: red; background: black; padding: 10px; display: none; font-weight: bold; }
</style>
</head>
<body>

<div id="error"></div>

<div class="game">
  <div style="display:flex; flex-direction:column; align-items:center; gap:20px;">
    <div class="score" id="score">0</div>
    <div style="color:#8899aa" id="perSec">0 / сек</div>
    <div class="planet" id="planet"></div>
  </div>
  <div class="panel">
    <h3 style="text-align:center; margin-top:0;">Магазин</h3>
    <div id="shop"></div>
  </div>
</div>

<script>
// Защита от ошибок
window.onerror = function(msg) {
  document.getElementById('error').style.display = 'block';
  document.getElementById('error').innerText = 'ОШИБКА: ' + msg;
};

let score = 0;
const upgrades = [
  { id: 'click', name: 'Усилитель клика', desc: '+1 за клик', base: 15, mult: 1.5, eff: 1, cnt: 0, type: 'click' },
  { id: 'drone', name: 'Дрон', desc: '+1 в сек', base: 25, mult: 1.15, eff: 1, cnt: 0, type: 'auto' }
];

function getClickPower() {
  return 1 + upgrades[0].cnt * upgrades[0].eff;
}

function getPerSec() {
  return upgrades[1].cnt * upgrades[1].eff;
}

function getCost(u) {
  return Math.floor(u.base * Math.pow(u.mult, u.cnt));
}

function formatNum(n) {
  return Math.floor(n).toString();
}

function updateUI() {
  document.getElementById('score').innerText = formatNum(score);
  document.getElementById('perSec').innerText = formatNum(getPerSec()) + ' / сек';
  
  const shop = document.getElementById('shop');
  shop.innerHTML = '';
  
  upgrades.forEach(function(u) {
    const cost = getCost(u);
    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = '<b>' + u.name + '</b><br><span style="font-size:12px;color:#aaa">' + u.desc + '</span><br><span style="color:gold">💰 ' + cost + '</span> (куплено: ' + u.cnt + ')';
    
    div.onclick = function() {
      if (score >= cost) {
        score -= cost;
        u.cnt++;
        updateUI();
      }
    };
    shop.appendChild(div);
  });
}

document.getElementById('planet').onclick = function() {
  score += getClickPower();
  updateUI();
};

// Автодоход каждые 100 мс
setInterval(function() {
  score += getPerSec() / 10;
  updateUI();
}, 100);

updateUI();
</script>
</body>
</html>
