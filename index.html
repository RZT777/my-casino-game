<script>
  // ================= ВРЕМЯ И ДАТА =================
  let gameTime = 8 * 60; 
  let gameDate = new Date(2026, 9, 19); 
  let timeInterval;
  let isPaused = false;
  let isLunch = false;

  function updateClock() {
    const hours = Math.floor(gameTime / 60) % 24;
    const minutes = gameTime % 60;
    const formattedTime = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`;
    
    const months = ['Янв', 'Фев', 'Мар', 'Апр', 'Май', 'Июн', 'Июл', 'Авг', 'Сен', 'Окт', 'Ноя', 'Дек'];
    const formattedDate = `${gameDate.getDate()} ${months[gameDate.getMonth()]}`;
    const dayNum = gameDate.getDate() - 18;
    
    document.getElementById('clockDisplay').textContent = `День ${dayNum} | ${formattedDate} | ${formattedTime}`;
    if (document.getElementById('sleepTimeDisplay')) document.getElementById('sleepTimeDisplay').textContent = formattedTime;
    
    if (gameTime >= 12 * 60 && gameTime < 13 * 60) {
        if (!isLunch) { isLunch = true; showModal('Обед', 'У вас обед с 12:00 до 13:00. Можно отдохнуть.'); }
    } else { isLunch = false; }
    
    if (gameTime >= 18 * 60 && document.getElementById('app-mechanic').classList.contains('active') && simGameState === 'working') {
        finishDay();
    }
  }

  function startTime() {
    if (timeInterval) clearInterval(timeInterval);
    timeInterval = setInterval(() => {
        if (isPaused) return;
        gameTime++;
        
        if (gameTime >= 24 * 60) {
            gameTime = 0;
            gameDate.setDate(gameDate.getDate() + 1);
        }
        
        updateClock();
        
        if (creditDebt > 0 && !inJail) {
            if (Math.random() < 0.02) {
                triggerBailiffs();
            }
        }
    }, 1000);
  }

  // ================= БАЗОВОЕ СОСТОЯНИЕ =================
  let balance = 5000; 
  let dirtyCash = 150000; // Изменил для теста, чтобы вы увидели наличку
  let chips = 0;
  const CHIP_PRICE = 1000;
  let playerName = "";
  let playerCity = "";
  
  let creditDebt = 0;
  let creditTotal = 0;
  let creditProgress = { 50000: 0, 100000: 0, 250000: 0, 500000: 0, 1000000: 0, 2500000: 0 }; 
  const CREDIT_LEVELS = [
    { amount: 50000, label: "50 000 ₽" }, 
    { amount: 100000, label: "100 000 ₽" },
    { amount: 250000, label: "250 000 ₽" }, 
    { amount: 500000, label: "500 000 ₽" },
    { amount: 1000000, label: "1 000 000 ₽" }, 
    { amount: 2500000, label: "2 500 000 ₽" }
  ];

  let loanTermMonths = 1;
  let depositAmount = 0;
  let depositDays = 0;

  // ===== СОСТОЯНИЕ СИМУЛЯТОРА =====
  let fatigue = 0; 
  let food = 100; 
  let transport = 'walk'; 
  let palyhAngry = true;
  let currentClientSim = null;
  let selectedSimPart = null;
  let simGameState = 'idle'; 
  
  let ownedCar = null;
  let currentCarType = 'none'; 
  let carUpgrades = { engine: 0, suspension: 0, lights: 0, comfort: 0 };
  let engineType = 'stock';

  let isShawarmaSick = false;
  let timurPartsFixed = 0; 
  let currentRent = null;
  let currentRentType = 'none'; 
  let ownedProperties = [];
  let usedClients = []; 

  let inJail = false;
  let jailDays = 0;
  let drugStock = 0;
  let extortedProperties = [];

  // NPC Отношения
  let npcs = [
    { id: 'anya', name: 'Аня', role: 'Медсестра', avatar: '👩‍⚕️', level: 0, bonus: 'Скидка на лечение' },
    { id: 'oleg', name: 'Олег', role: 'Водитель Пазика', avatar: '👨‍✈️', level: 0, bonus: 'Скидка на проезд' },
    { id: 'marina', name: 'Марина', role: 'Продавщица', avatar: '👩‍🍳', level: 0, bonus: 'Бесплатная еда' }
  ];

  const simClients = [
    { name: "Алексей", car: "ВАЗ 2107", symptoms: "Двигатель троит, потеря мощности.", brokenId: 'spark', reward: 2000 },
    { name: "Мария", car: "Hyundai Solaris", symptoms: "При повороте ключа — тишина.", brokenId: 'battery', reward: 1500 },
    { name: "Дмитрий", car: "Nissan Almera", symptoms: "Машина закипела, валит пар.", brokenId: 'radiator', reward: 2500 },
    { name: "Елена", car: "ВАЗ 2114", symptoms: "Обороты плавают, глохнет.", brokenId: 'sensor', reward: 1800 },
    { name: "Сергей", car: "Nissan X-Trail", symptoms: "Вой из-под капота, заглох.", brokenId: 'timing', reward: 3000 },
    { name: "Тимур", car: "ВАЗ 2114", symptoms: "ВСЁ СЛОМАНО! Двигатель не заводится, генератор не дает заряд, свечи мокрые.", brokenId: 'all', reward: 15000 },
    { name: "Василий", car: "ВАЗ 2109", symptoms: "Белый густой дым из выхлопной, уровень антифриза падает.", brokenId: 'gasket', reward: 4000 },
    { name: "Ольга", car: "Hyundai Accent", symptoms: "Стук в двигателе, низкое давление масла.", brokenId: 'pistons', reward: 5000 },
    { name: "Иван", car: "Nissan Qashqai", symptoms: "Машина не заводится, стартер крутит, но нет искры.", brokenId: 'ignition', reward: 2200 },
    { name: "Аня", car: "ВАЗ 2110", symptoms: "Стук в подвеске, машина кидает.", brokenId: 'suspension', reward: 2500, npcId: 'anya' },
    { name: "Олег", car: "ПАЗ 3205", symptoms: "Не работает свет, ночью ехать невозможно.", brokenId: 'lights', reward: 3000, npcId: 'oleg' },
    { name: "Марина", car: "Hyundai Accent", symptoms: "Печка не греет, в салоне холодно.", brokenId: 'heater', reward: 2000, npcId: 'marina' }
  ];

  const simParts = [
    { id: 'spark', name: 'Свечи', icon: '⚡' },
    { id: 'timing', name: 'Ремень', icon: '⚙️' },
    { id: 'battery', name: 'АКБ', icon: '🔋' },
    { id: 'fuel', name: 'Насос', icon: '⛽' },
    { id: 'radiator', name: 'Радиатор', icon: '🌡️' },
    { id: 'sensor', name: 'Датчик', icon: '🛠️' },
    { id: 'generator', name: 'Генератор', icon: '🔌' },
    { id: 'gasket', name: 'Прокладка', icon: '💧' },
    { id: 'pistons', name: 'Поршни', icon: '⚙️' },
    { id: 'ignition', name: 'Зажигание', icon: '🔥' },
    { id: 'suspension', name: 'Подвеска', icon: '🛞' },
    { id: 'lights', name: 'Освещение', icon: '💡' },
    { id: 'heater', name: 'Печка', icon: '🔥' }
  ];

  function updateUI() {
    if (fatigue < 0) fatigue = 0;
    if (fatigue > 100) fatigue = 100;
    if (food < 0) food = 0;
    if (food > 100) food = 100;

    document.querySelectorAll('.balance-val').forEach(el => el.textContent = balance.toLocaleString('ru-RU'));
    if(document.getElementById('dirtyCash')) document.getElementById('dirtyCash').textContent = dirtyCash.toLocaleString('ru-RU');
    if(document.getElementById('bankMainBalance')) document.getElementById('bankMainBalance').textContent = balance.toLocaleString('ru-RU') + ' ₽';
    if(document.getElementById('bankDirtyBalance')) document.getElementById('bankDirtyBalance').textContent = dirtyCash.toLocaleString('ru-RU') + ' ₽';
    if(document.getElementById('fatigueVal')) document.getElementById('fatigueVal').textContent = Math.floor(fatigue);
    if(document.getElementById('foodVal')) document.getElementById('foodVal').textContent = Math.floor(food);
    if(document.getElementById('transportVal')) document.getElementById('transportVal').textContent = transport === 'bike' ? 'Велосипед' : (ownedCar ? ownedCar : 'Пешком');
    if(document.getElementById('palyhMood')) document.getElementById('palyhMood').textContent = palyhAngry ? 'Злой' : 'Довольный';
    
    if(document.getElementById('buyTransportBtn')) {
        document.getElementById('buyTransportBtn').style.display = (transport === 'walk' && !ownedCar && balance >= 15000) ? 'block' : 'none';
    }
    if(document.getElementById('exChips')) document.getElementById('exChips').textContent = chips.toLocaleString('ru-RU');
    updateMinesUI();
    renderCreditLevels();
    renderGarage();
    renderRelations();
  }

  // ===== СТАРТ ИГРЫ =====
  function startGame() {
    const nameInput = document.getElementById('playerNameInput').value.trim();
    const cityInput = document.getElementById('playerCityInput').value;
    
    if (!nameInput) return alert("Введите ваше имя!");
    if (!cityInput) return alert("Выберите город!");
    
    playerName = nameInput;
    playerCity = cityInput;
    
    document.getElementById('startupModal').classList.remove('show');
    document.getElementById('greetingText').textContent = `Привет, ${playerName}! Ты переехал в город ${playerCity} и устроился механиком на СТО к Палычу.`;
    
    addMessage("Палыч", "Здарова, новенький. Завтра в 8 утра чтобы был как штык. Опоздаешь - вычту из зарплаты.");
    
    updateUI();
    startTime();
  }

  // ===== СООБЩЕНИЯ =====
  let messages = [];
  function addMessage(sender, text) {
    messages.push({ sender, text });
    renderMessages();
    
    // Защита от ошибки, если экрана нет
    const appMsg = document.getElementById('app-messages');
    if (appMsg && !appMsg.classList.contains('active')) {
        const badge = document.getElementById('msgBadge');
        if (badge) {
            badge.style.display = 'flex';
            badge.textContent = parseInt(badge.textContent) + 1;
        }
    }
  }

  function renderMessages() {
    const container = document.getElementById('messagesList');
    if (!container) return; // Защита
    container.innerHTML = '';
    messages.slice().reverse().forEach(msg => {
        const el = document.createElement('div');
        el.className = 'message-item';
        el.innerHTML = `
            <div class="message-avatar">${msg.sender[0]}</div>
            <div class="message-content">
                <div class="message-sender">${msg.sender}</div>
                <div class="message-text">${msg.text}</div>
            </div>
        `;
        container.appendChild(el);
    });
  }

  // ===== ОТНОШЕНИЯ (NPC) =====
  function renderRelations() {
    const container = document.getElementById('relationsList');
    if (!container) return;
    container.innerHTML = '';

    npcs.forEach(npc => {
        const el = document.createElement('div');
        el.className = 'npc-card';
        
        let status = 'Не знакомы';
        if (npc.level >= 100) status = 'Друг/Девушка';
        else if (npc.level >= 50) status = 'Приятели';
        else if (npc.level >= 10) status = 'Знакомые';

        el.innerHTML = `
            <div class="npc-header">
                <div class="npc-avatar">${npc.avatar}</div>
                <div class="npc-info">
                    <h3>${npc.name}</h3>
                    <p>${npc.role} | ${status} (${npc.level}/100)</p>
                </div>
            </div>
            <div class="progress-bar"><div class="progress-fill" style="width: ${npc.level}%"></div></div>
            <div class="npc-actions">
                <button class="npc-btn-talk" onclick="talkToNpc('${npc.id}')">Поговорить</button>
                <button class="npc-btn-gift" onclick="giftNpc('${npc.id}')" ${balance < 500 || npc.level >= 100 ? 'disabled' : ''}>Подарок (500 ₽)</button>
            </div>
            <p style="font-size: 12px; margin-top: 10px; color: var(--success);">Бонус: ${npc.bonus}</p>
        `;
        container.appendChild(el);
    });
  }

  function talkToNpc(id) {
    const npc = npcs.find(n => n.id === id);
    if (!npc) return;
    if (fatigue >= 90) return showModal('Усталость', 'Вы слишком устали для общения.');
    
    fatigue += 5;
    npc.level = Math.min(100, npc.level + 2);
    updateUI();
    showModal('Разговор', `Вы поговорили с ${npc.name}. Отношения улучшились.`);
  }

  function giftNpc(id) {
    const npc = npcs.find(n => n.id === id);
    if (!npc) return;
    if (balance < 500) return showModal('Ошибка', 'Недостаточно денег.');
    
    balance -= 500;
    npc.level = Math.min(100, npc.level + 10);
    updateUI();
    showModal('Подарок', `${npc.name} довольна(ен). Отношения значительно улучшились.`);
  }

  // ===== СТО (Работа) =====
  function startDay() {
    if (inJail) return showModal('Тюрьма', 'Вы в СИЗО. Сначала откупитесь или отсидите срок.');
    
    if (isShawarmaSick) {
        isShawarmaSick = false; 
        food -= 15;
        if (food < 0) food = 0;
        updateUI();
        showModal('Проблемы с животом', 'Вы съели что-то не то вчера. Всю ночь провели в уборной и не смогли пойти на работу. День прошел зря, но вы отдохнули.');
        return; 
    }

    document.getElementById('lifeSetup').style.display = 'none';
    document.getElementById('workSetup').style.display = 'block';
    
    if (fatigue > 50) palyhAngry = true;
    else palyhAngry = false;
    
    simGameState = 'working';
    updateUI();
  }

  function takeNewClient() {
    if (food < 10) return showModal('Голод', 'Вы слишком голодны. Сходите в магазин.');
    
    let fatigueFromRoad = 20; 
    
    if (transport === 'bike') fatigueFromRoad = 10;
    else if (currentCarType === 'classic') fatigueFromRoad = 15;
    else if (currentCarType === 'bad') fatigueFromRoad = 18;
    else if (currentCarType === 'good') fatigueFromRoad = 5;
    else if (currentCarType === 'average') fatigueFromRoad = 10;
    
    if (carUpgrades.suspension > 0) fatigueFromRoad -= (carUpgrades.suspension * 2);
    if (fatigueFromRoad < 1) fatigueFromRoad = 1;
    
    fatigue += fatigueFromRoad;
    
    if (fatigue > 100) fatigue = 100;
    updateUI();
    
    if (fatigue > 90) return showModal('Истощение', 'Вы слишком устали. Вам нужно поспать или поесть.');
    
    let availableClients = simClients.filter(c => !usedClients.includes(c.name));
    if (availableClients.length === 0) {
        usedClients = []; 
        availableClients = simClients;
    }
    
    const client = availableClients[Math.floor(Math.random() * availableClients.length)];
    usedClients.push(client.name);
    currentClientSim = client;
    selectedSimPart = null;
    timurPartsFixed = 0; 
    
    document.getElementById('clientName').textContent = `Клиент: ${client.name}`;
    document.getElementById('clientCar').textContent = `Машина: ${client.car}`;
    document.getElementById('clientSymptoms').textContent = `"${client.symptoms}"`;
    
    document.getElementById('clientOrderBox').style.display = 'block';
    document.getElementById('takeClientBtn').style.display = 'none';
    document.getElementById('finishDayBtn').style.display = 'none';
    document.getElementById('mechanicResult').textContent = '';
    document.getElementById('btnRepair').style.display = 'none';
    
    simGameState = 'client';
    renderSimDiagram();
  }

  function renderSimDiagram() {
    const container = document.getElementById('engineDiagram');
    container.innerHTML = '';
    
    simParts.forEach(part => {
      const el = document.createElement('div');
      el.className = 'engine-part';
      if (selectedSimPart === part.id) el.classList.add('active');
      
      el.innerHTML = `<span class="engine-part-icon">${part.icon}</span><span class="engine-part-name">${part.name}</span>`;
      el.onclick = () => {
        selectedSimPart = part.id;
        renderSimDiagram();
        document.getElementById('btnRepair').style.display = 'block';
      };
      container.appendChild(el);
    });
  }

  function diagnosePart() {
    if (!selectedSimPart) return showModal('Ошибка', 'Выберите деталь!');
    showModal('Диагностика', 'Вы проверили деталь. Это может быть причиной поломки.');
    fatigue += 5; 
    updateUI();
  }

  function repairPart() {
    if (!selectedSimPart) return;
    if (balance < 1000) return showModal('Ошибка', 'Нет денег на запчасть (1000 ₽)!');

    if (currentClientSim.name === 'Тимур') {
        balance -= 1000;
        fatigue += 10;
        timurPartsFixed++;
        updateUI();
        
        if (timurPartsFixed < 3) {
            showModal('Ремонт', `Вы заменили деталь Тимуру. Прогресс: ${timurPartsFixed}/3.`);
            selectedSimPart = null;
            document.getElementById('btnRepair').style.display = 'none';
        } else {
            balance += currentClientSim.reward;
            updateUI();
            showModal('Успех', `Вы починили Тимура! Вы получили ${currentClientSim.reward} ₽.`);
            document.getElementById('clientOrderBox').style.display = 'none';
            document.getElementById('takeClientBtn').style.display = 'block';
            document.getElementById('finishDayBtn').style.display = 'block';
            simGameState = 'working';
        }
        return;
    }

    if (selectedSimPart === currentClientSim.brokenId) {
      balance -= 1000; 
      balance += currentClientSim.reward; 
      fatigue += 10;
      food -= 5; 
      
      if (currentClientSim.npcId) {
          const npc = npcs.find(n => n.id === currentClientSim.npcId);
          if (npc) {
              npc.level = Math.min(100, npc.level + 20);
              showModal('Бонус', `Вы помогли ${npc.name}. Отношения улучшились!`);
          }
      }
      
      updateUI();
      showModal('Успех', `Машина починена! Вы получили ${currentClientSim.reward} ₽.`);
      
      document.getElementById('clientOrderBox').style.display = 'none';
      document.getElementById('takeClientBtn').style.display = 'block';
      document.getElementById('finishDayBtn').style.display = 'block';
      simGameState = 'working';
      
      if (Math.random() < 0.3) {
        palyhAngry = false;
        showModal('Палыч', 'Палыч кивнул вам. Кажется, он вами доволен.');
      }
      
    } else {
      balance -= 1000; 
      fatigue += 10;
      updateUI();
      showModal('Ошибка', 'Вы заменили не ту деталь! Клиент недоволен, вы потеряли 1000 ₽.');
      selectedSimPart = null;
      document.getElementById('btnRepair').style.display = 'none';
    }
  }

  function finishDay() {
    document.getElementById('lifeSetup').style.display = 'block';
    document.getElementById('workSetup').style.display = 'none';
    document.getElementById('startDayBtn').style.display = 'none'; 
    
    simGameState = 'idle';
    updateUI();
  }

  // ===== ГАРАЖ =====
  function renderGarage() {
    const container = document.getElementById('garageContent');
    if (!container) return;
    if (!ownedCar) {
        container.innerHTML = `<p style="text-align:center; color:var(--text-muted); margin-top:50px;">У вас нет машины. Купите её в Автосалоне.</p>`;
        return;
    }
    
    container.innerHTML = `
        <h3 style="color:var(--accent); margin-bottom:10px; text-align:center;">Ваша машина: ${ownedCar}</h3>
        
        <div class="car-category">Замена двигателя</div>
        <div class="shop-item">
            <div class="shop-item-info">
                <div class="shop-item-title">Контрактный мотор (Не оригинал)</div>
                <div class="shop-item-desc">Дешево, но подделка. Может сломаться в любой момент.</div>
            </div>
            <div style="text-align:right;">
                <div class="shop-item-price">30 000 ₽</div>
                <button class="buy-btn" onclick="buyEngine('fake')" ${engineType === 'fake' ? 'disabled' : ''}>Купить</button>
            </div>
        </div>
        <div class="shop-item">
            <div class="shop-item-info">
                <div class="shop-item-title">Оригинальный мотор</div>
                <div class="shop-item-desc">Надежный, но дорогой. +5% к скорости и снижение износа.</div>
            </div>
            <div style="text-align:right;">
                <div class="shop-item-price">150 000 ₽</div>
                <button class="buy-btn" onclick="buyEngine('real')" ${engineType === 'real' ? 'disabled' : ''}>Купить</button>
            </div>
        </div>

        <div class="car-category">Тюнинг</div>
        <div class="shop-item">
            <div class="shop-item-info"><div class="shop-item-title">Подвеска (Stage ${carUpgrades.suspension})</div><div class="shop-item-desc">Снижает усталость в дороге (-2% за уровень).</div></div>
            <div style="text-align:right;"><div class="shop-item-price">${(carUpgrades.suspension+1)*15000} ₽</div><button class="buy-btn" onclick="buyUpgrade('suspension')" ${carUpgrades.suspension >= 3 ? 'disabled' : ''}>Улучшить</button></div>
        </div>
        <div class="shop-item">
            <div class="shop-item-info"><div class="shop-item-title">Освещение (Stage ${carUpgrades.lights})</div><div class="shop-item-desc">Решает проблему "нихрена не видно ночью".</div></div>
            <div style="text-align:right;"><div class="shop-item-price">${(carUpgrades.lights+1)*10000} ₽</div><button class="buy-btn" onclick="buyUpgrade('lights')" ${carUpgrades.lights >= 1 ? 'disabled' : ''}>Улучшить</button></div>
        </div>
        <div class="shop-item">
            <div class="shop-item-info"><div class="shop-item-title">Комфорт (Stage ${carUpgrades.comfort})</div><div class="shop-item-desc">Кресла, климат. Дополнительное снижение усталости.</div></div>
            <div style="text-align:right;"><div class="shop-item-price">${(carUpgrades.comfort+1)*25000} ₽</div><button class="buy-btn" onclick="buyUpgrade('comfort')" ${carUpgrades.comfort >= 2 ? 'disabled' : ''}>Улучшить</button></div>
        </div>
    `;
  }

  function buyEngine(type) {
    let price = type === 'fake' ? 30000 : 150000;
    if (balance >= price) {
        balance -= price;
        engineType = type;
        updateUI();
        showModal('Двигатель', type === 'fake' ? 'Вы поставили поддельный мотор. Надеюсь, он не развалится.' : 'Оригинальный мотор установлен. Машина поедет как новая!');
    } else {
        showModal('Ошибка', 'Недостаточно денег!');
    }
  }

  function buyUpgrade(type) {
    let price = 0;
    if (type === 'suspension') price = (carUpgrades.suspension + 1) * 15000;
    if (type === 'lights') price = (carUpgrades.lights + 1) * 10000;
    if (type === 'comfort') price = (carUpgrades.comfort + 1) * 25000;
    
    if (balance >= price) {
        balance -= price;
        carUpgrades[type]++;
        updateUI();
        showModal('Тюнинг', 'Улучшение установлено!');
    } else {
        showModal('Ошибка', 'Недостаточно денег!');
    }
  }

  // ===== ДАРКНЕТ =====
  function switchDarknetTab(tab, btn) {
    document.querySelectorAll('.darknet-tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.darknet-list').forEach(l => l.style.display = 'none');
    btn.classList.add('active');

  // ===== СОН =====
  function goToSleep() {
    if (inJail) {
        jailDays--;
        if (jailDays <= 0) {
            inJail = false;
            closeApp('jail');
            showModal('СИЗО', 'Вы отсидели срок. Вышли на свободу.');
        } else {
            updateJailTimer();
            return;
        }
    }
    
    isPaused = true;
    let sleepTime = gameTime;
    
    let rentIncome = 0;
    ownedProperties.forEach(p => rentIncome += p.income);
    if (rentIncome > 0) balance += rentIncome;
    if (currentRent) balance -= currentRent.cost;
    
    if (depositDays > 0) {
        depositDays--;
        if (depositDays === 0) {
            balance += Math.floor(depositAmount * 1.3);
            showModal('Вклад', `Вклад закрыт. Получено ${Math.floor(depositAmount * 1.3)} ₽.`);
            depositAmount = 0;
        }
    }
    
    food -= 20;
    if (food < 0) food = 0;
    
    if (currentRentType === 'bad') fatigue = 30;
    else if (currentRentType === 'average') fatigue = 10;
    else if (currentRentType === 'good') fatigue = 0;
    else if (currentRentType === 'best') fatigue = 0;
    else fatigue = 20;
    
    let wakeUpTime = 8 * 60; 
    let isLate = false;
    let latePenalty = 1000;
    
    if (sleepTime >= 0 && sleepTime < 6 * 60) { 
        if (Math.random() < 0.7) { 
            isLate = true;
            wakeUpTime += 60; 
            balance -= latePenalty;
            
            addMessage("Палыч", `Ты че, уснул там?! Я тебя жду, а тебя нет! Опоздал на час! Штраф <span>${latePenalty} ₽</span>, и чтоб больше такого не было!`);
        }
    }
    
    gameDate.setDate(gameDate.getDate() + 1);
    gameTime = wakeUpTime;
    isPaused = false;
    closeApp('sleep');
    
    if (isLate) {
        // Оставляем только СМС
    } else {
        showModal('Доброе утро', `Вы проснулись в 08:00. Пора на работу!`);
    }
    
    document.getElementById('startDayBtn').style.display = 'block';
    updateUI();
    updateClock();
  }

  function cashoutMines() { if (!isPlayingMines) return; const win = Math.floor(minesBet * currentMult); balance += win; isPlayingMines = false; showModal('Выигрыш', `Забрано ${win} ₽`); renderEmptyMinesGrid(); updateUI(); }

  // Банк
  function renderCreditLevels() { const container = document.getElementById('creditLevels'); if(!container) return; container.innerHTML = ''; if (creditDebt > 0) { document.getElementById('creditStatus').textContent = `Долг: ${creditDebt} ₽`; container.style.display = 'none'; document.getElementById('creditActions').style.display = 'block'; } else { container.style.display = 'flex'; document.getElementById('creditActions').style.display = 'none'; CREDIT_LEVELS.forEach((lvl, i) => { const btn = document.createElement('button'); btn.className = 'credit-level-btn'; const unlocked = i === 0 || (creditProgress[CREDIT_LEVELS[i-1].amount] || 0) >= 1; btn.disabled = !unlocked; btn.innerHTML = unlocked ? `Взять ${lvl.label} <span>Погашено: ${creditProgress[lvl.amount] || 0}</span>` : `🔒 ${lvl.label}`; if(unlocked) btn.onclick = () => takeCredit(lvl.amount); container.appendChild(btn); }); } }
  function takeCredit(amount) { if (creditDebt > 0) return; creditTotal = amount; creditDebt = Math.round(amount * (1.1 + loanTermMonths * 0.05)); balance += amount; updateUI(); showModal('Успех', `Кредит ${amount} ₽ выдан на ${loanTermMonths} мес! К возврату: ${creditDebt} ₽`); }
  function payCredit() { if (balance < creditDebt) return showModal('Ошибка', 'Мало денег'); balance -= creditDebt; creditProgress[creditTotal] = (creditProgress[creditTotal] || 0) + 1; creditDebt = 0; creditTotal = 0; updateUI(); showModal('Успех', 'Кредит погашен!'); }
  
  // Календарь
  function renderCalendar() {
    const year = gameDate.getFullYear(); const month = gameDate.getMonth();
    const firstDay = new Date(year, month, 1); const lastDay = new Date(year, month + 1, 0);
    const daysInMonth = lastDay.getDate(); let startDay = firstDay.getDay();
    if (startDay === 0) startDay = 6; else startDay -= 1;
    const monthNames = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
    const titleEl = document.getElementById('calendarTitle');
    if(titleEl) titleEl.textContent = `${monthNames[month]} ${year}`;
    const grid = document.getElementById('calendarGrid'); 
    if(!grid) return;
    grid.innerHTML = '';
    const dayNames = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
    dayNames.forEach(name => { const d = document.createElement('div'); d.className = 'calendar-day-name'; d.textContent = name; grid.appendChild(d); });
    for (let i = 0; i < startDay; i++) { const d = document.createElement('div'); d.className = 'calendar-day other-month'; grid.appendChild(d); }
    
    for (let i = 1; i <= daysInMonth; i++) {
      const d = document.createElement('div'); d.className = 'calendar-day'; d.textContent = i;
      if (i === gameDate.getDate()) d.classList.add('today');
      grid.appendChild(d);
    }
  }
  const prevMonthBtn = document.getElementById('prevMonth');
  if(prevMonthBtn) prevMonthBtn.onclick = () => { gameDate.setMonth(gameDate.getMonth() - 1); renderCalendar(); };
  const nextMonthBtn = document.getElementById('nextMonth');
  if(nextMonthBtn) nextMonthBtn.onclick = () => { gameDate.setMonth(gameDate.getMonth() + 1); renderCalendar(); };
  renderCalendar();

  // Тетрис (Заглушка, чтобы не было ошибки)
  let tetrisInterval;
  function initTetris() { 
      if(tetrisInterval) clearInterval(tetrisInterval); 
      // Тут должен быть код игры в тетрис, но его нет в исходнике
  }
  function stopTetris() { clearInterval(tetrisInterval); }

  // Инициализация
  updateUI();
  drawWheel();
  renderEmptyMinesGrid();
  updateClock();

</script>
